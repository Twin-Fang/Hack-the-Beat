name: Deploy Server

on:
  push:
    branches: [main]
    # 문서만 바뀌었을 때 서버를 재배포하지 않는다 (심사 중 불필요한 재시작 방지)
    paths:
      - 'server/**'
      - '.github/workflows/PROJECT-SERVER-CICD.yaml'
  workflow_dispatch:

env:
  IMAGE_NAME: hack-the-beat-back-container
  CONTAINER_NAME: hack-the-beat-back
  SERVER_PORT: 8096

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper 실행권한 부여
        run: chmod +x gradlew

      # 테스트는 H2 인메모리로 돌아 운영 DB가 필요 없다
      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hack-the-beat-back-container:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            export PW=${{ secrets.SERVER_PASSWORD }}
            PORT=8096
            CONTAINER_NAME="hack-the-beat-back"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hack-the-beat-back-container:latest"

            echo "도커 이미지 풀: $IMAGE"
            echo $PW | sudo -S docker pull $IMAGE

            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "기존 컨테이너 제거 중..."
              echo $PW | sudo -S docker rm -f $CONTAINER_NAME
            fi

            # postgres_default 네트워크에 붙어야 DB를 호스트명 postgres로 찾는다
            # --restart unless-stopped: NAS 재부팅 후에도 자동 복구
            echo $PW | sudo -S docker run -d --name $CONTAINER_NAME \
              --restart unless-stopped \
              --network postgres_default \
              -p ${PORT}:8080 \
              -e TZ=Asia/Seoul \
              -e "DB_URL=${{ secrets.DB_URL }}" \
              -e "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
              -e "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              -v /etc/localtime:/etc/localtime:ro \
              $IMAGE

            echo "기동 대기..."
            for i in $(seq 1 30); do
              if wget -q -O - http://localhost:${PORT}/health 2>/dev/null | grep -q UP; then
                echo "헬스체크 통과 (${i}회차)"
                exit 0
              fi
              sleep 3
            done
            echo "헬스체크 실패 — 로그 확인"
            echo $PW | sudo -S docker logs --tail 40 $CONTAINER_NAME
            exit 1
